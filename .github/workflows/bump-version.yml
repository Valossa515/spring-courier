name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (semver, e.g. 2.1.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::Invalid version format. Use semver (e.g. 2.1.0)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract current version
        id: current
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Update version in all files
        env:
          OLD_VERSION: ${{ steps.current.outputs.version }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          echo "Bumping $OLD_VERSION → $NEW_VERSION"

          # pom.xml — first <version> only (awk for portability)
          awk -v old="$OLD_VERSION" -v new="$NEW_VERSION" \
            '!done && /<version>/ { sub("<version>" old "</version>", "<version>" new "</version>"); done=1 } { print }' \
            pom.xml > pom.xml.tmp && mv pom.xml.tmp pom.xml

          # README.md
          sed -i "s/<version>${OLD_VERSION}<\/version>/<version>${NEW_VERSION}<\/version>/g" README.md
          sed -i "s/spring-courier:${OLD_VERSION}/spring-courier:${NEW_VERSION}/g" README.md

          # README.pt-BR.md
          sed -i "s/<version>${OLD_VERSION}<\/version>/<version>${NEW_VERSION}<\/version>/g" README.pt-BR.md
          sed -i "s/spring-courier:${OLD_VERSION}/spring-courier:${NEW_VERSION}/g" README.pt-BR.md

          # CLAUDE.md — matches any version number on the Current Version line
          sed -i 's/\*\*Current Version:\*\* [0-9]\+\.[0-9]\+\.[0-9]\+[^ ]*/**Current Version:** '"${NEW_VERSION}"'/g' CLAUDE.md

          echo "Files updated:"
          git diff --name-only

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-version-${{ inputs.version }}
          commit-message: "chore: bump version to ${{ inputs.version }}"
          title: "chore: bump version to ${{ inputs.version }}"
          body: |
            Automated version bump: `${{ steps.current.outputs.version }}` → `${{ inputs.version }}`

            ### Files updated
            - `pom.xml`
            - `README.md`
            - `README.pt-BR.md`
            - `CLAUDE.md`
          labels: release
          delete-branch: true
