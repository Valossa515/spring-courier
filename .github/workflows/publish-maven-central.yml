name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (optional - uses pom.xml version if not specified)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.deleted != true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # Provisiona ~/.m2/settings.xml com o server "central" usado pelo
          # central-publishing-maven-plugin.
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye

      - name: Set release version
        if: ${{ github.event.inputs.version != '' }}
        run: |
          ./mvnw -B -ntp versions:set \
            -DnewVersion="${{ github.event.inputs.version }}" \
            -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Deploy reactor bundle to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # `deploy` aciona o central-publishing-maven-plugin (extensions=true),
          # que agrega o parent POM e todos os módulos (jar + sources + javadoc
          # + POM + assinaturas + checksums) em um único bundle e o envia ao
          # Central Portal.
          ./mvnw -B -ntp clean deploy -Prelease -DskipTests \
            -Dgpg.passphrase="${GPG_PASSPHRASE}"
