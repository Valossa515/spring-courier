name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (optional - uses pom.xml version if not specified)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Configurar GPG para usar a senha do secret
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpg-connect-agent reloadagent /bye
      
      - name: Extract version from pom.xml
        id: extract-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Build and Package with Release Profile
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw clean verify -DskipTests -Prelease \
            -Dgpg.passphrase="${GPG_PASSPHRASE}"
      
      - name: List Generated Artifacts
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          cd target
          echo "Artefatos gerados pelo Maven:"
          ls -lh spring-courier-${VERSION}* 2>/dev/null || true
      
      - name: Generate Checksums
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          cd target
          
          # Função para gerar checksums de um arquivo
          generate_checksums() {
            local file=$1
            if [ ! -f "$file" ]; then
              echo "Arquivo não encontrado: $file"
              return
            fi
            
            echo "Gerando checksums para: $file"
            
            # SHA1
            sha1sum "$file" | awk '{print $1}' > "${file}.sha1"
            
            # MD5
            md5sum "$file" | awk '{print $1}' > "${file}.md5"
            
            # SHA256
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            
            # SHA512
            sha512sum "$file" | awk '{print $1}' > "${file}.sha512"
          }
          
          # Gerar checksums para todos os artefatos
          for artifact in spring-courier-${VERSION}.jar \
                         spring-courier-${VERSION}-sources.jar \
                         spring-courier-${VERSION}-javadoc.jar \
                         spring-courier-${VERSION}.pom \
                         spring-courier-${VERSION}.jar.asc \
                         spring-courier-${VERSION}-sources.jar.asc \
                         spring-courier-${VERSION}-javadoc.jar.asc \
                         spring-courier-${VERSION}.pom.asc; do
            generate_checksums "$artifact"
          done
          
          echo "Checksums gerados:"
          ls -lh *.sha1 *.md5 *.sha256 *.sha512 2>/dev/null || echo "Nenhum checksum encontrado"
      
      - name: Create Bundle
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          cd target
          
          # Criar diretório para o bundle
          BUNDLE_DIR="maven-central-bundle"
          mkdir -p "$BUNDLE_DIR"
          
          # Copiar todos os artefatos necessários para o bundle
          cp spring-courier-${VERSION}.jar "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.jar.asc "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.jar.sha1 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.jar.md5 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.jar.sha256 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.jar.sha512 "$BUNDLE_DIR/"
          
          cp spring-courier-${VERSION}-sources.jar "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-sources.jar.asc "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-sources.jar.sha1 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-sources.jar.md5 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-sources.jar.sha256 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-sources.jar.sha512 "$BUNDLE_DIR/"
          
          cp spring-courier-${VERSION}-javadoc.jar "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-javadoc.jar.asc "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-javadoc.jar.sha1 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-javadoc.jar.md5 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-javadoc.jar.sha256 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}-javadoc.jar.sha512 "$BUNDLE_DIR/"
          
          cp spring-courier-${VERSION}.pom "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.pom.asc "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.pom.sha1 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.pom.md5 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.pom.sha256 "$BUNDLE_DIR/"
          cp spring-courier-${VERSION}.pom.sha512 "$BUNDLE_DIR/"
          
          # Criar o arquivo ZIP do bundle
          zip -r spring-courier-${VERSION}-bundle.zip "$BUNDLE_DIR"
          
          echo "Bundle criado: spring-courier-${VERSION}-bundle.zip"
          ls -lh spring-courier-${VERSION}-bundle.zip
      
      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          BUNDLE_FILE="target/spring-courier-${VERSION}-bundle.zip"
          
          echo "Publicando bundle no Maven Central..."
          
          # Upload do bundle para o Sonatype Central Portal
          RESPONSE=$(curl -X POST \
            https://central.sonatype.com/api/v1/publisher/upload \
            -H "Authorization: Bearer ${SONATYPE_TOKEN}" \
            -F "bundle=@${BUNDLE_FILE}" \
            -w "\n%{http_code}" \
            -s)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Bundle publicado com sucesso!"
            echo "Verifique o status em: https://central.sonatype.com/publishing"
          else
            echo "❌ Erro ao publicar bundle"
            exit 1
          fi
      
      - name: Upload Bundle as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: target/spring-courier-${{ steps.extract-version.outputs.VERSION }}-bundle.zip
          retention-days: 30
