name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (optional - uses pom.xml version if not specified)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          # Se o secret estiver em base64, use:
          # printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --yes --import

          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback"   >> ~/.gnupg/gpg.conf
          echo "no-tty"                   >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent
          gpg --list-secret-keys

      - name: Extract version from pom.xml
        id: extract-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build and Package with Release Profile
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw -B clean verify -DskipTests -Prelease \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -Dgpg.pinentry-mode=loopback

      - name: List Generated Artifacts
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          cd target
          echo "Artefatos gerados pelo Maven:"
          ls -lh spring-courier-${VERSION}* 2>/dev/null || true

      - name: Generate Checksums
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          cd target
          generate_checksums() {
            local file=$1
            [ -f "$file" ] || { echo "Arquivo não encontrado: $file"; return; }
            echo "Gerando checksums para: $file"
            sha1sum   "$file" | awk '{print $1}' > "${file}.sha1"
            md5sum    "$file" | awk '{print $1}' > "${file}.md5"
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
            sha512sum "$file" | awk '{print $1}' > "${file}.sha512"
          }
          ARTIFACTS=(
            "spring-courier-${VERSION}.jar"
            "spring-courier-${VERSION}-sources.jar"
            "spring-courier-${VERSION}-javadoc.jar"
            "spring-courier-${VERSION}.pom"
          )
          for artifact in "${ARTIFACTS[@]}"; do
            generate_checksums "$artifact"
            [ -f "${artifact}.asc" ] && generate_checksums "${artifact}.asc"
          done
          echo "Checksums gerados:"
          ls -lh *.sha1 *.md5 *.sha256 *.sha512 2>/dev/null || echo "Nenhum checksum encontrado"

      - name: Create Bundle
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          cd target
          BUNDLE_DIR="maven-central-bundle"
          mkdir -p "$BUNDLE_DIR"
          ARTIFACTS=(
            "spring-courier-${VERSION}.jar"
            "spring-courier-${VERSION}-sources.jar"
            "spring-courier-${VERSION}-javadoc.jar"
            "spring-courier-${VERSION}.pom"
          )
          EXTENSIONS=("" ".asc" ".sha1" ".md5" ".sha256" ".sha512")
          for artifact in "${ARTIFACTS[@]}"; do
            for ext in "${EXTENSIONS[@]}"; do
              file="${artifact}${ext}"
              if [ -f "$file" ]; then
                cp "$file" "$BUNDLE_DIR/"
                echo "Copiado: $file"
              else
                echo "Aviso: Arquivo não encontrado: $file"
              fi
            done
          done
          zip -r spring-courier-${VERSION}-bundle.zip "$BUNDLE_DIR"
          echo "Bundle criado: spring-courier-${VERSION}-bundle.zip"
          ls -lh spring-courier-${VERSION}-bundle.zip
          echo "Conteúdo do bundle:"
          unzip -l spring-courier-${VERSION}-bundle.zip

      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          VERSION=${{ steps.extract-version.outputs.VERSION }}
          BUNDLE_FILE="target/spring-courier-${VERSION}-bundle.zip"
          echo "Publicando bundle no Maven Central..."

          RESPONSE=$(curl -X POST \
            https://central.sonatype.com/api/v1/publisher/upload \
            -u "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" \
            -F "bundle=@${BUNDLE_FILE}" \
            -w "\n%{http_code}" \
            -s)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Bundle publicado com sucesso!"
            echo "Verifique o status em: https://central.sonatype.com/publishing"
          else
            echo "❌ Erro ao publicar bundle"
            exit 1
          fi

      - name: Upload Bundle as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-bundle
          path: target/spring-courier-${{ steps.extract-version.outputs.VERSION }}-bundle.zip
          retention-days: 30