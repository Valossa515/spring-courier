apiVersion: v1
kind: Namespace
metadata:
  name: spring-courier
  labels:
    app: spring-courier
---
apiVersion: v1
kind: Secret
metadata:
  name: maven-central-secrets
  namespace: spring-courier
  labels:
    app: spring-courier
    component: cd
type: Opaque
stringData:
  # Substitua pelos valores reais antes de aplicar.
  # Em producao, use uma ferramenta como Sealed Secrets ou External Secrets Operator.
  gpg-private-key: "<GPG_PRIVATE_KEY>"
  gpg-passphrase: "<GPG_PASSPHRASE>"
  sonatype-username: "<SONATYPE_USERNAME>"
  sonatype-password: "<SONATYPE_PASSWORD>"
