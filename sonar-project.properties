sonar.exclusions=**/target/**,**/build/**,**/generated-sources/**,**/out/**
sonar.test.exclusions=**/target/**,**/build/**,**/generated-sources/**,**/out/**
sonar.coverage.exclusions=**/config/**,**/*Configuration.java,**/dto/**,**/model/**,**/entity/**,**/generated/**