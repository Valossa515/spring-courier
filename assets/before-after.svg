<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace" font-size="14">
  <defs>
    <linearGradient id="bgBefore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f1f"/>
      <stop offset="1" stop-color="#1a1414"/>
    </linearGradient>
    <linearGradient id="bgAfter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a22"/>
      <stop offset="1" stop-color="#14201a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .kw  { fill: #c792ea; }
      .typ { fill: #82aaff; }
      .str { fill: #c3e88d; }
      .ann { fill: #ffcb6b; }
      .com { fill: #6a737d; font-style: italic; }
      .fn  { fill: #82aaff; }
      .txt { fill: #d6deeb; }
      .hi  { fill: #ff6b9d; font-weight: 700; }
      .ok  { fill: #4ade80; font-weight: 700; }
      .title { fill: #ffffff; font-weight: 700; font-size: 18px; }
      .sub   { fill: #94a3b8; font-size: 12px; }
      .dot-r { fill: #ff5f56; }
      .dot-y { fill: #ffbd2e; }
      .dot-g { fill: #27c93f; }
    </style>
  </defs>

  <!-- ===== BEFORE PANEL ===== -->
  <g transform="translate(30,30)" filter="url(#shadow)">
    <rect width="560" height="460" rx="12" fill="url(#bgBefore)"/>
    <!-- header bar -->
    <rect width="560" height="36" rx="12" fill="#0f0a0a"/>
    <rect y="24" width="560" height="12" fill="#0f0a0a"/>
    <circle class="dot-r" cx="20" cy="18" r="6"/>
    <circle class="dot-y" cx="40" cy="18" r="6"/>
    <circle class="dot-g" cx="60" cy="18" r="6"/>
    <text x="280" y="23" text-anchor="middle" class="title">❌ Before</text>
    <text x="280" y="55" text-anchor="middle" class="sub">3 collaborators · boilerplate everywhere · 1 line that matters</text>

    <!-- code -->
    <g transform="translate(24,90)">
      <text y="0"><tspan class="ann">@RestController</tspan></text>
      <text y="20"><tspan class="ann">@RequiredArgsConstructor</tspan></text>
      <text y="40"><tspan class="kw">public class</tspan><tspan class="typ"> ProductController</tspan><tspan class="txt"> {</tspan></text>
      <text y="60"><tspan class="txt">    </tspan><tspan class="kw">private final</tspan><tspan class="typ"> ProductService</tspan><tspan class="txt"> service;</tspan></text>
      <text y="80"><tspan class="txt">    </tspan><tspan class="kw">private final</tspan><tspan class="typ"> ProductValidator</tspan><tspan class="txt"> validator;</tspan></text>
      <text y="100"><tspan class="txt">    </tspan><tspan class="kw">private final</tspan><tspan class="typ"> AuditLogger</tspan><tspan class="txt"> auditor;</tspan></text>
      <text y="130"><tspan class="txt">    </tspan><tspan class="ann">@PostMapping</tspan><tspan class="txt">(</tspan><tspan class="str">"/products"</tspan><tspan class="txt">)</tspan></text>
      <text y="150"><tspan class="txt">    </tspan><tspan class="kw">public</tspan><tspan class="typ"> ResponseEntity</tspan><tspan class="txt">&lt;</tspan><tspan class="typ">Product</tspan><tspan class="txt">&gt; </tspan><tspan class="fn">create</tspan><tspan class="txt">(</tspan></text>
      <text y="170"><tspan class="txt">            </tspan><tspan class="ann">@RequestBody</tspan><tspan class="typ"> CreateProductRequest</tspan><tspan class="txt"> req) {</tspan></text>
      <text y="195"><tspan class="hi">        validator.validate(req);</tspan><tspan class="com">          // boilerplate</tspan></text>
      <text y="215"><tspan class="hi">        auditor.log(</tspan><tspan class="str">"create"</tspan><tspan class="hi">, req);</tspan><tspan class="com">       // boilerplate</tspan></text>
      <text y="235"><tspan class="ok">        Product saved = service.create(req);</tspan></text>
      <text y="250"><tspan class="com">                                              // ↑ the only line that matters</tspan></text>
      <text y="275"><tspan class="hi">        return</tspan><tspan class="typ"> ResponseEntity</tspan><tspan class="hi">.status(</tspan><tspan class="str">201</tspan><tspan class="hi">).body(saved);</tspan></text>
      <text y="295"><tspan class="txt">    }</tspan></text>
      <text y="315"><tspan class="txt">}</tspan></text>
    </g>
  </g>

  <!-- ===== ARROW ===== -->
  <g transform="translate(595,260)">
    <circle r="20" fill="#2dd4bf"/>
    <text y="6" text-anchor="middle" fill="#0a0a0a" font-size="22" font-weight="700">→</text>
  </g>

  <!-- ===== AFTER PANEL ===== -->
  <g transform="translate(630,30)" filter="url(#shadow)">
    <rect width="540" height="460" rx="12" fill="url(#bgAfter)"/>
    <rect width="540" height="36" rx="12" fill="#0a120d"/>
    <rect y="24" width="540" height="12" fill="#0a120d"/>
    <circle class="dot-r" cx="20" cy="18" r="6"/>
    <circle class="dot-y" cx="40" cy="18" r="6"/>
    <circle class="dot-g" cx="60" cy="18" r="6"/>
    <text x="270" y="23" text-anchor="middle" class="title">✅ After — with Spring Courier</text>
    <text x="270" y="55" text-anchor="middle" class="sub">1 dependency · controller dispatches · concerns live in behaviors</text>

    <g transform="translate(24,110)">
      <text y="0"><tspan class="ann">@RestController</tspan></text>
      <text y="20"><tspan class="ann">@RequiredArgsConstructor</tspan></text>
      <text y="40"><tspan class="kw">public class</tspan><tspan class="typ"> ProductController</tspan><tspan class="txt"> {</tspan></text>
      <text y="65"><tspan class="txt">    </tspan><tspan class="kw">private final</tspan><tspan class="typ"> Courier</tspan><tspan class="txt"> courier;</tspan></text>
      <text y="100"><tspan class="txt">    </tspan><tspan class="ann">@PostMapping</tspan><tspan class="txt">(</tspan><tspan class="str">"/products"</tspan><tspan class="txt">)</tspan></text>
      <text y="120"><tspan class="txt">    </tspan><tspan class="kw">public</tspan><tspan class="typ"> ResponseEntity</tspan><tspan class="txt">&lt;?&gt; </tspan><tspan class="fn">create</tspan><tspan class="txt">(</tspan></text>
      <text y="140"><tspan class="txt">            </tspan><tspan class="ann">@RequestBody</tspan><tspan class="typ"> CreateProductCommand</tspan><tspan class="txt"> cmd) {</tspan></text>
      <text y="170"><tspan class="ok">        return courier.send(cmd).toEntity();</tspan></text>
      <text y="195"><tspan class="txt">    }</tspan></text>
      <text y="215"><tspan class="txt">}</tspan></text>
    </g>

    <!-- bottom highlights -->
    <g transform="translate(24,360)">
      <text y="0" class="sub" fill="#4ade80">✓ validation  →  ValidationBehavior</text>
      <text y="20" class="sub" fill="#4ade80">✓ auditing    →  PreProcessor / PostProcessor</text>
      <text y="40" class="sub" fill="#4ade80">✓ retry/cache →  built-in pipeline behaviors</text>
      <text y="60" class="sub" fill="#4ade80">✓ metrics/OTel→  auto-configured when on classpath</text>
    </g>
  </g>
</svg>
